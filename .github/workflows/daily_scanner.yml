name: Daily Williams Fractal 10 Scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. 21:00 UTC is 5:00 PM ET during EDT,
    # after the US market daily candle has closed.
    - cron: '0 21 * * 1-5'

permissions:
  contents: write

jobs:
  build-daily-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily Williams Fractal scanner
        run: python daily_williams_fractal_scanner.py

      - name: Deploy daily dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: daily-williams-fractal-report
          destination_dir: daily-williams-fractal
          keep_files: true
