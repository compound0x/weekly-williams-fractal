name: Weekly Williams Fractal 10 Scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. 14:00 UTC is 10:00 AM ET during EDT.
    # Running Saturday avoids the still-forming weekly candle.
    - cron: '0 14 * * 6'

permissions:
  contents: write

jobs:
  build-weekly-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly Williams Fractal scanner
        run: python weekly_williams_fractal_scanner.py

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: weekly-williams-fractal-report
          destination_dir: weekly-williams-fractal
          keep_files: true
